<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"
     font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <!-- Source of architecture.png: rendered at 2x (device scale factor 2, window 1400 x 520) by
       headless Chrome with a transparent default background, which keeps the corners clear. -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1733"/>
      <stop offset="1" stop-color="#11306b"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9db8e4"/>
    </marker>
  </defs>

  <rect width="1400" height="520" rx="28" fill="url(#bg)"/>

  <g fill="#ffffff" text-anchor="middle">
    <!-- Column captions -->
    <text x="505" y="90" font-size="22" font-weight="700">Media Center</text>
    <text x="505" y="114" font-size="14" fill="#a9bddf">from your Windows 7 disc, run by Mono</text>
    <text x="980" y="90" font-size="22" font-weight="700">This project</text>
    <text x="980" y="114" font-size="14" fill="#a9bddf">translation layer</text>
    <text x="1275" y="90" font-size="22" font-weight="700">macOS</text>
    <text x="1275" y="114" font-size="14" fill="#a9bddf">the Mac's own</text>

    <!-- The installer -->
    <rect x="40" y="250" width="220" height="100" rx="12" fill="#2563c9" stroke="#5b8ff0" stroke-width="2"/>
    <text x="150" y="296" font-size="20" font-weight="700">Windows 7 disc</text>
    <text x="150" y="320" font-size="14" fill="#dce7f7">the .iso you own</text>

    <!-- Media Center's own code -->
    <rect x="340" y="136" width="330" height="328" rx="16" fill="#163f8c" stroke="#3d74d6" stroke-width="2"/>
    <rect x="358" y="160" width="294" height="80" rx="10" fill="#2a66cc"/>
    <text x="505" y="196" font-size="19" font-weight="700">UI framework</text>
    <text x="505" y="220" font-size="14" fill="#dce7f7">describes each scene</text>
    <rect x="358" y="260" width="294" height="80" rx="10" fill="#2a66cc"/>
    <text x="505" y="296" font-size="19" font-weight="700">Shell</text>
    <text x="505" y="320" font-size="14" fill="#dce7f7">menus, pages, settings</text>
    <rect x="358" y="360" width="294" height="80" rx="10" fill="#2a66cc"/>
    <text x="505" y="396" font-size="19" font-weight="700">Media</text>
    <text x="505" y="420" font-size="14" fill="#dce7f7">music, pictures, video</text>

    <!-- Written here -->
    <rect x="830" y="160" width="300" height="80" rx="12" fill="#128062" stroke="#36c398" stroke-width="2"/>
    <text x="980" y="196" font-size="19" font-weight="700">Render engine</text>
    <text x="980" y="220" font-size="14" fill="#dcf5ec">draws the scene with Metal</text>
    <rect x="830" y="260" width="300" height="80" rx="12" fill="#128062" stroke="#36c398" stroke-width="2"/>
    <text x="980" y="296" font-size="19" font-weight="700">Windows stand-ins</text>
    <text x="980" y="320" font-size="14" fill="#dcf5ec">windows, input, files, registry</text>
    <rect x="830" y="360" width="300" height="80" rx="12" fill="#128062" stroke="#36c398" stroke-width="2"/>
    <text x="980" y="396" font-size="19" font-weight="700">Component stand-ins</text>
    <text x="980" y="420" font-size="14" fill="#dcf5ec">Media Player, video player, database</text>

    <!-- macOS -->
    <rect x="1190" y="136" width="170" height="328" rx="16" fill="#252e3f" stroke="#56637a" stroke-width="2"/>
    <rect x="1206" y="172" width="138" height="56" rx="10" fill="#3a4559"/>
    <text x="1275" y="206" font-size="17" font-weight="600">Metal</text>
    <rect x="1206" y="272" width="138" height="56" rx="10" fill="#3a4559"/>
    <text x="1275" y="306" font-size="17" font-weight="600">AppKit</text>
    <rect x="1206" y="372" width="138" height="56" rx="10" fill="#3a4559"/>
    <text x="1275" y="406" font-size="17" font-weight="600">AVFoundation</text>
  </g>

  <!-- Arrows -->
  <g stroke="#9db8e4" stroke-width="2.5" fill="none" marker-end="url(#head)">
    <line x1="262" y1="300" x2="336" y2="300"/>
    <line x1="672" y1="200" x2="826" y2="200"/>
    <line x1="672" y1="300" x2="826" y2="300"/>
    <line x1="672" y1="400" x2="826" y2="400"/>
    <line x1="1132" y1="200" x2="1186" y2="200"/>
    <line x1="1132" y1="300" x2="1186" y2="300"/>
    <line x1="1132" y1="400" x2="1186" y2="400"/>
  </g>
  <g fill="#b9cbe8" font-size="14" text-anchor="middle">
    <text x="299" y="288">unpack</text>
    <text x="299" y="322">and patch</text>
    <text x="750" y="188">what to draw</text>
    <text x="750" y="288">Windows calls</text>
    <text x="750" y="388">COM calls</text>
  </g>
</svg>
